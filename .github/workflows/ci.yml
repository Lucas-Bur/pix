name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.10.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - run: vp run check

      - run: vp run test:coverage

      - run: vp run build

      # Upload coverage on push to main (so the main branch has data for the badge)
      # and on PRs from this repo (skip forks — they can't access CODECOV_TOKEN)
      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.fork == false }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Effect diagnostics
        id: effect-diag
        continue-on-error: true
        run: vp run lint:effect:ci

      - name: Effect diagnostics crash warning
        if: ${{ steps.effect-diag.outcome == 'failure' }}
        run: echo "::warning::Effect diagnostics step crashed — check that effect-tsgo is installed and not segfaulting"

      - name: Fallow quality audit
        id: fallow-audit
        continue-on-error: true
        run: vp run lint:fallow:ci

      - name: Fallow crash warning
        if: ${{ steps.fallow-audit.outcome == 'failure' }}
        run: echo "::warning::Fallow audit step crashed — check that fallow is installed and not segfaulting"
